[project]
name = "continuous-video-recorder"
version = "0.2.0"
description = "Continuous video recorder with presence detection for performance monitoring"
readme = "README.md"
requires-python = ">=3.9.13"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pylsl>=1.16.0",
    "vidgear>=0.3.3",
    "setuptools>=65.0.0",
    "cv2-enumerate-cameras>=0.1.0",
]

[project.optional-dependencies]
windows = [
    "WMI>=1.5.1",
]
