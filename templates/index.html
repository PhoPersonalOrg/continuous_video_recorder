<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Stream Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .camera-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(4, 1fr);
        }
        
        /* Responsive layout */
        @media (max-width: 1200px) {
            .camera-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .camera-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .camera-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .camera-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #333;
            border-bottom: 1px solid #444;
        }
        
        .camera-title {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status-dot.connected {
            background-color: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }
        
        .status-dot.disconnected {
            background-color: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        
        .camera-stream {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .camera-stream img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .loading-indicator {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .disconnected-message {
            color: #ef4444;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }
        
        .camera-info {
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #aaa;
            background-color: #2a2a2a;
        }
        
        .no-cameras {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1>Camera Stream Viewer</h1>
        <div class="status-bar">
            <span id="camera-count">Loading cameras...</span>
            <span id="server-status">Server: Active</span>
        </div>
    </header>
    
    <div id="camera-grid" class="camera-grid">
        <div class="no-cameras">
            <p>Loading camera streams...</p>
        </div>
    </div>
    
    <script>
        // State management
        let cameras = {};
        let updateInterval = null;
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadCameras();
            // Update status every 2 seconds
            updateInterval = setInterval(updateCameraStatus, 2000);
        });
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
        
        // Load camera list and create stream elements
        async function loadCameras() {
            try {
                const response = await fetch('/api/cameras');
                const data = await response.json();
                
                cameras = data;
                renderCameras();
                
            } catch (error) {
                console.error('Failed to load cameras:', error);
                document.getElementById('camera-grid').innerHTML = `
                    <div class="no-cameras">
                        <p>Failed to load cameras. Please refresh the page.</p>
                    </div>
                `;
            }
        }
        
        // Render camera grid
        function renderCameras() {
            const grid = document.getElementById('camera-grid');
            
            if (Object.keys(cameras).length === 0) {
                grid.innerHTML = `
                    <div class="no-cameras">
                        <p>No cameras available</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = '';
            
            for (const [cameraId, camera] of Object.entries(cameras)) {
                const card = createCameraCard(cameraId, camera);
                grid.appendChild(card);
            }
            
            updateStatusBar();
        }
        
        // Create camera card element
        function createCameraCard(cameraId, camera) {
            const card = document.createElement('div');
            card.className = 'camera-card';
            card.id = `camera-${cameraId}`;
            
            const statusClass = camera.is_connected ? 'connected' : 'disconnected';
            const statusText = camera.is_connected ? 'Connected' : 'Disconnected';
            
            card.innerHTML = `
                <div class="camera-header">
                    <div class="camera-title">Camera ${cameraId}</div>
                    <div class="status-indicator">
                        <span class="status-dot ${statusClass}"></span>
                        <span>${statusText}</span>
                    </div>
                </div>
                <div class="camera-stream">
                    ${camera.is_connected 
                        ? `<img src="${camera.stream_url}" alt="Camera ${cameraId} Stream" />`
                        : `<div class="disconnected-message">Camera Disconnected</div>`
                    }
                </div>
                <div class="camera-info">
                    Frames: <span id="frame-count-${cameraId}">${camera.frame_count}</span>
                </div>
            `;
            
            return card;
        }
        
        // Update camera status indicators
        async function updateCameraStatus() {
            try {
                const response = await fetch('/api/cameras');
                const data = await response.json();
                
                for (const [cameraId, camera] of Object.entries(data)) {
                    const card = document.getElementById(`camera-${cameraId}`);
                    if (!card) continue;
                    
                    // Update status indicator
                    const statusDot = card.querySelector('.status-dot');
                    const statusText = card.querySelector('.status-indicator span:last-child');
                    
                    if (camera.is_connected) {
                        statusDot.className = 'status-dot connected';
                        statusText.textContent = 'Connected';
                        
                        // Ensure stream is showing
                        const streamDiv = card.querySelector('.camera-stream');
                        if (!streamDiv.querySelector('img')) {
                            streamDiv.innerHTML = `<img src="${camera.stream_url}" alt="Camera ${cameraId} Stream" />`;
                        }
                    } else {
                        statusDot.className = 'status-dot disconnected';
                        statusText.textContent = 'Disconnected';
                        
                        // Show disconnected message
                        const streamDiv = card.querySelector('.camera-stream');
                        if (!streamDiv.querySelector('.disconnected-message')) {
                            streamDiv.innerHTML = '<div class="disconnected-message">Camera Disconnected</div>';
                        }
                    }
                    
                    // Update frame count
                    const frameCount = document.getElementById(`frame-count-${cameraId}`);
                    if (frameCount) {
                        frameCount.textContent = camera.frame_count;
                    }
                }
                
                cameras = data;
                updateStatusBar();
                
            } catch (error) {
                console.error('Failed to update camera status:', error);
            }
        }
        
        // Update status bar
        function updateStatusBar() {
            const cameraCount = Object.keys(cameras).length;
            const connectedCount = Object.values(cameras).filter(c => c.is_connected).length;
            
            document.getElementById('camera-count').textContent = 
                `Cameras: ${connectedCount}/${cameraCount} connected`;
        }
    </script>
</body>
</html>
