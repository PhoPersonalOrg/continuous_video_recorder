video:
  resolution: [1280, 720]
  fps: 24
  codec: "mp4v"
  quality: "medium"
  
detection:
  face_confidence: 0.5
  motion_threshold: 30
  face_check_interval: 5  # Check face every N frames
  
buffer:
  absence_timeout: 35  # seconds
  
storage:
  output_dir: "M:\\ScreenRecordings\\EyeTrackerVR_Recordings"
  min_duration: 5  # minimum seconds to save a video
  auto_split_duration: 3600  # auto-split recordings every N seconds (3600 = 1 hour)
  
webcam:
  # Single camera mode (backward compatible)
  device_index: 0
  
  # Multi-camera mode (uncomment to use multiple cameras)
  # cameras:
  #   - device_index: 0
  #     name: "Front Camera"
  #     output_dir: "M:\\ScreenRecordings\\EyeTrackerVR_Recordings\\Camera0"
  #   - device_index: 1
  #     name: "Side Camera"
  #     output_dir: "M:\\ScreenRecordings\\EyeTrackerVR_Recordings\\Camera1"

lsl:
  enabled: true
  stream_name: "VideoRecorderMarkers"
  stream_type: "Markers"
  source_id: "continuous_video_recorder"
  marker_start: "RECORDING_START"
  marker_stop: "RECORDING_STOP"
  include_metadata: true  # Include filename, session ID in marker metadata

